name: Mercury Upstream Sync & Copr Builder

on:
  schedule:
    # 16:30 UTC (ABD Doğu ~12:30 Öğle Arası) ve 21:30 UTC (ABD Doğu ~17:30 İş Çıkışı)
    - cron: '30 16,21 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Yeni sürüm olmasa bile paketlemeyi zorla (Release sayacını artırır)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. AŞAMA: GÜNCEL SÜRÜMÜN YAYINLANIP YAYINLANMADIĞINI KONTROL ET
  # =========================================================================
  check_update:
    name: 1. Upstream Sürüm Kontrolü
    runs-on: ubuntu-latest
    outputs:
      update_needed: ${{ steps.check.outputs.update_needed }}
      clean_version: ${{ steps.check.outputs.clean_version }}
      release_num: ${{ steps.check.outputs.release_num }}
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Upstream Sürümünü ve state.json Dosyasını Denetle
        id: check
        run: |
          set -euo pipefail
          REPO="Alex313031/Mercury"
          
          RELEASE_JSON=$(curl -sSL -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${REPO}/releases/latest")
          
          LATEST_TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name // empty')

          if [[ -z "$LATEST_TAG" || "$LATEST_TAG" == "null" ]]; then
            echo "::error::Hata: Upstream sürüm bulunamadı veya API limiti aşıldı."
            exit 1
          fi

          CLEAN_VER=$(echo "$LATEST_TAG" | grep -oE '[0-9]+(\.[0-9]+)+' | head -n 1 || true)
          if [ -z "$CLEAN_VER" ]; then
            CLEAN_VER=$(echo "$LATEST_TAG" | sed -E 's/^[^0-9]+//; s/[^0-9.]+$//')
          fi

          STATE_FILE="state.json"
          SAVED_VER=""
          SAVED_NUM=0

          if [ -f "$STATE_FILE" ]; then
            SAVED_VER=$(jq -r '.version // empty' "$STATE_FILE")
            SAVED_NUM=$(jq -r '.release // 0' "$STATE_FILE")
          fi

          echo "Mevcut Kayıtlı Sürüm (state.json): ${SAVED_VER:-Yok} (Release: $SAVED_NUM)"
          echo "Upstream Son Sürüm: $CLEAN_VER (Etiket: $LATEST_TAG)"

          if [ "$SAVED_VER" != "$CLEAN_VER" ]; then
            echo "::notice::Yeni sürüm tespit edildi! ($SAVED_VER -> $CLEAN_VER). 2. aşamaya geçiliyor..."
            echo "update_needed=true" >> "$GITHUB_OUTPUT"
            echo "clean_version=$CLEAN_VER" >> "$GITHUB_OUTPUT"
            echo "release_num=1" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.force_build }}" = "true" ]; then
            NEXT_NUM=$((SAVED_NUM + 1))
            echo "::notice::Manuel zorunlu derleme tetiklendi! Sürüm: $CLEAN_VER, Yeni Release: $NEXT_NUM"
            echo "update_needed=true" >> "$GITHUB_OUTPUT"
            echo "clean_version=$CLEAN_VER" >> "$GITHUB_OUTPUT"
            echo "release_num=$NEXT_NUM" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Yeni güncelleme yayınlanmamış ($CLEAN_VER zaten güncel). İş akışı sonlandırılıyor."
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
            echo "clean_version=$CLEAN_VER" >> "$GITHUB_OUTPUT"
            echo "release_num=$SAVED_NUM" >> "$GITHUB_OUTPUT"
          fi

  # =========================================================================
  # 2. AŞAMA: VARLIKLARI İNDİR, AÇ VE FEDORA COPR SPEC İLE YENİDEN PAKETLE
  # =========================================================================
  package_srpm:
    name: 2. İndir, Ayıkla ve SRPM Paketle
    needs: check_update
    if: needs.check_update.outputs.update_needed == 'true'
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - name: Gerekli Paketleri Yükle
        run: |
          dnf install -y git curl jq cpio rpm-build rpmdevtools \
                         binutils tar zstd gzip python3 desktop-file-utils \
                         libappstream-glib file

      - name: Git Güvenli Dizin Yapılandırması
        run: |
          git config --global --add safe.directory '*'

      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Upstream Yayın Bilgilerini Al
        run: |
          REPO="Alex313031/Mercury"
          curl -sSL -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${REPO}/releases/latest" > upstream_release.json

      - name: Varlıkları İndir, Ayıkla ve Standart Payload Paketle
        run: |
          set -euo pipefail
          ROOT_DIR="$(pwd)"
          RELEASE_JSON=$(cat upstream_release.json)

          get_candidates() {
            local arch_pat="$1"
            # 1. RPM
            echo "$RELEASE_JSON" | jq -r --arg pat "$arch_pat" \
              '.assets[] | select(.name | test($pat; "i")) | select(.name | test("\\.rpm$"; "i")) | ["rpm", .browser_download_url, .name] | @tsv'
            # 2. DEB
            echo "$RELEASE_JSON" | jq -r --arg pat "$arch_pat" \
              '.assets[] | select(.name | test($pat; "i")) | select(.name | test("\\.deb$"; "i")) | ["deb", .browser_download_url, .name] | @tsv'
            # 3. AppImage
            echo "$RELEASE_JSON" | jq -r --arg pat "$arch_pat" \
              '.assets[] | select(.name | test($pat; "i")) | select(.name | test("\\.appimage$"; "i")) | ["appimage", .browser_download_url, .name] | @tsv'
          }

          process_arch() {
            local arch="$1"
            local arch_pat="$2"
            local success=0

            echo "=========================================================="
            echo "Mimari İşleniyor: $arch (Desen: $arch_pat)"
            echo "=========================================================="

            local candidates
            candidates=$(get_candidates "$arch_pat")

            if [ -z "$candidates" ]; then
              echo "HATA: $arch ($arch_pat) için upstream varlığı bulunamadı!" >&2
              exit 1
            fi

            mkdir -p "${ROOT_DIR}/dl_${arch}"

            while IFS=$'\t' read -r format url filename; do
              [ -z "$format" ] && continue

              echo "--> Deneniyor: [$arch] Format: $format | Dosya: $filename"
              
              rm -rf "${ROOT_DIR}/extract_${arch}" "${ROOT_DIR}/payload_${arch}"
              mkdir -p "${ROOT_DIR}/extract_${arch}" "${ROOT_DIR}/payload_${arch}"

              # 1. İndir
              if ! curl -sSL -f "$url" -o "${ROOT_DIR}/dl_${arch}/${filename}"; then
                echo "::warning:: [$arch] $filename indirilemedi, sıradaki formata geçiliyor..."
                continue
              fi

              # 2. Çıkar
              cd "${ROOT_DIR}/extract_${arch}"
              local extract_ok=1

              case "$filename" in
                *.rpm)
                  rpm2cpio "${ROOT_DIR}/dl_${arch}/${filename}" | cpio -idmv || extract_ok=0
                  ;;
                *.deb)
                  ( ar x "${ROOT_DIR}/dl_${arch}/${filename}" && tar -xf data.tar.* ) || extract_ok=0
                  ;;
                *.AppImage|*.appimage)
                  chmod +x "${ROOT_DIR}/dl_${arch}/${filename}"
                  ( "${ROOT_DIR}/dl_${arch}/${filename}" --appimage-extract && mv squashfs-root/* . && rm -rf squashfs-root ) || extract_ok=0
                  ;;
                *)
                  extract_ok=0
                  ;;
              esac

              if [ $extract_ok -eq 0 ]; then
                echo "::warning:: [$arch] $filename açılamadı! Bir sonraki pakete geçiliyor..."
                cd "${ROOT_DIR}"
                continue
              fi

              # 3. Gerçek Gecko Çekirdek Dizinini Tespit Et (/usr/bin kısayollarını atla)
              local core_dir
              core_dir=$(find . -type f \( -name "application.ini" -o -name "omni.ja" -o -name "libxul.so" \) -exec dirname {} + | head -n 1 || true)

              if [ -z "$core_dir" ]; then
                echo "::warning:: [$arch] $filename içinde Gecko motor çekirdeği (omni.ja/application.ini) bulunamadı!"
                cd "${ROOT_DIR}"
                continue
              fi

              echo "Bulunan gerçek motor dizini: $core_dir"
              cp -a "$core_dir"/* "${ROOT_DIR}/payload_${arch}/"

              # 4. Dosya İzinleri ve Simgeler
              chmod -R u+w "${ROOT_DIR}/payload_${arch}"
              find "${ROOT_DIR}/payload_${arch}" -type f \( -name "mercury" -o -name "mercury-bin" -o -name "*.so*" \) -exec chmod 0755 {} +

              # Dışarıda kalan olası simgeleri de köke yedekle
              find . -type f \( -name "*logo*.png" -o -name "*mercury*.png" -o -name "default*.png" \) -exec cp -n {} "${ROOT_DIR}/payload_${arch}/" \; 2>/dev/null || true

              # 5. Emniyet Kilidi: Payload Boyut Kontrolü (Minimum 50 MB)
              local payload_size
              payload_size=$(du -sm "${ROOT_DIR}/payload_${arch}" | cut -f1)
              echo "[$arch] Toplam payload boyutu: ${payload_size} MB"

              if [ "$payload_size" -lt 50 ]; then
                echo "::warning:: [$arch] Payload boyutu yetersiz ($payload_size MB < 50 MB). Eksik paketleme engellendi!"
                cd "${ROOT_DIR}"
                continue
              fi

              # 6. Tarball Oluştur
              if ! tar -czf "${ROOT_DIR}/mercury-payload-${arch}.tar.gz" -C "${ROOT_DIR}/payload_${arch}" .; then
                echo "::warning:: [$arch] Payload tarball oluşturulamadı!"
                cd "${ROOT_DIR}"
                continue
              fi

              cd "${ROOT_DIR}"
              echo "BAŞARILI: [$arch] mimarisi tam olarak ($payload_size MB) paketlendi."
              success=1
              break
            done <<< "$candidates"

            if [ $success -eq 0 ]; then
              echo "HATA: [$arch] için hiçbir paket tam boyutla hazırlanamadı!" >&2
              exit 1
            fi
          }

          process_arch "x86_64" "AVX2"
          process_arch "aarch64" "ARM64"

      - name: Desktop Dosyasını Doğrula ve Oluştur
        run: |
          cat << 'EOF' > mercury-browser.desktop
          [Desktop Entry]
          Version=1.0
          Name=Mercury Browser
          GenericName=Web Browser
          Comment=Compiler-optimized web browser with hardware acceleration
          Exec=mercury-browser %U
          StartupNotify=true
          Terminal=false
          Icon=mercury-browser
          Type=Application
          Categories=Network;WebBrowser;
          MimeType=text/html;text/xml;application/xhtml+xml;x-scheme-handler/http;x-scheme-handler/https;
          StartupWMClass=mercury-default
          Actions=new-window;new-private-window;

          [Desktop Action new-window]
          Name=New Window
          Exec=mercury-browser %U

          [Desktop Action new-private-window]
          Name=New Incognito Window
          Exec=mercury-browser --incognito %U
          EOF
          desktop-file-validate mercury-browser.desktop

      - name: RPM/SRPM Paketle ve Yerel Doğrulama Testi Yap
        run: |
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp mercury-payload-x86_64.tar.gz ~/rpmbuild/SOURCES/
          cp mercury-payload-aarch64.tar.gz ~/rpmbuild/SOURCES/
          cp mercury-launcher.sh ~/rpmbuild/SOURCES/
          cp mercury-browser.desktop ~/rpmbuild/SOURCES/
          cp mercury-browser.metainfo.xml ~/rpmbuild/SOURCES/

          if [ -f "specs/mercury-browser.spec" ]; then
            cp specs/mercury-browser.spec ~/rpmbuild/SPECS/
          else
            cp mercury-browser.spec ~/rpmbuild/SPECS/
          fi

          SPEC_FILE=~/rpmbuild/SPECS/mercury-browser.spec
          sed -i "s/^Version:.*/Version:        ${{ needs.check_update.outputs.clean_version }}/" "$SPEC_FILE"
          sed -i "s/^Release:.*/Release:        ${{ needs.check_update.outputs.release_num }}%{?dist}/" "$SPEC_FILE"

          desktop-file-validate mercury-browser.desktop
          appstream-util validate-relax --nonet mercury-browser.metainfo.xml

          echo "Yerel derleme testi yapılıyor..."
          rpmbuild -ba --target x86_64 "$SPEC_FILE"

          echo "SRPM oluşturuluyor..."
          rpmbuild -bs "$SPEC_FILE"
          mkdir -p out
          cp ~/rpmbuild/SRPMS/*.src.rpm out/

      - name: SRPM Paketini 3. Aşama İçin Yükle
        uses: actions/upload-artifact@v4
        with:
          name: srpm-package
          path: out/*.src.rpm
          retention-days: 1

  # =========================================================================
  # 3. AŞAMA: FEDORA COPR DEPOSUNA GÖNDER VE SÜRÜM DURUMUNU KAYDET
  # =========================================================================
  publish_copr:
    name: 3. Copr Deposuna Gönder ve Yayınla
    needs: [check_update, package_srpm]
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - name: Gerekli Paketleri Yükle
        run: |
          dnf install -y git copr-cli

      - name: Git Güvenli Dizin Yapılandırması
        run: |
          git config --global --add safe.directory '*'

      - name: Depoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SRPM Paketini İndir
        uses: actions/download-artifact@v4
        with:
          name: srpm-package
          path: out/

      - name: Copr Deposuna Gönder (Fedora 44 ve Rawhide)
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          mkdir -p ~/.config
          echo "$COPR_CONFIG" > ~/.config/copr
          chmod 600 ~/.config/copr
          SRPM_FILE=$(ls out/*.src.rpm | head -n 1)

          copr-cli build universish/Mercury "$SRPM_FILE" \
            --chroot fedora-44-x86_64 \
            --chroot fedora-44-aarch64 \
            --chroot fedora-rawhide-x86_64 \
            --chroot fedora-rawhide-aarch64

      - name: Yeni Sürüm Bilgilerini state.json Dosyasına Kaydet
        run: |
          STATE_FILE="state.json"
          CURR_VER="${{ needs.check_update.outputs.clean_version }}"
          BUILD_NUM="${{ needs.check_update.outputs.release_num }}"

          echo "{\"version\": \"$CURR_VER\", \"release\": $BUILD_NUM}" > "$STATE_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$STATE_FILE"
          git commit -m "Update version state: ${CURR_VER}-${BUILD_NUM}" || echo "Değişiklik yok"
          git push origin HEAD:${{ github.ref_name }}
