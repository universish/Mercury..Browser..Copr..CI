- name: Varlıkları İndir, Ayıkla ve Standart Payload Paketle
        run: |
          set -euo pipefail
          ROOT_DIR="$(pwd)"
          RELEASE_JSON=$(cat upstream_release.json)

          get_candidates() {
            local arch_pat="$1"
            # 1. RPM
            echo "$RELEASE_JSON" | jq -r --arg pat "$arch_pat" \
              '.assets[] | select(.name | test($pat; "i")) | select(.name | test("\\.rpm$"; "i")) | ["rpm", .browser_download_url, .name] | @tsv'
            # 2. DEB
            echo "$RELEASE_JSON" | jq -r --arg pat "$arch_pat" \
              '.assets[] | select(.name | test($pat; "i")) | select(.name | test("\\.deb$"; "i")) | ["deb", .browser_download_url, .name] | @tsv'
            # 3. AppImage
            echo "$RELEASE_JSON" | jq -r --arg pat "$arch_pat" \
              '.assets[] | select(.name | test($pat; "i")) | select(.name | test("\\.appimage$"; "i")) | ["appimage", .browser_download_url, .name] | @tsv'
          }

          process_arch() {
            local arch="$1"
            local arch_pat="$2"
            local success=0

            echo "=========================================================="
            echo "Mimari İşleniyor: $arch (Desen: $arch_pat)"
            echo "=========================================================="

            local candidates
            candidates=$(get_candidates "$arch_pat")

            if [ -z "$candidates" ]; then
              echo "HATA: $arch ($arch_pat) için upstream varlığı bulunamadı!" >&2
              exit 1
            fi

            mkdir -p "${ROOT_DIR}/dl_${arch}"

            while IFS=$'\t' read -r format url filename; do
              [ -z "$format" ] && continue

              echo "--> Deneniyor: [$arch] Format: $format | Dosya: $filename"
              
              rm -rf "${ROOT_DIR}/extract_${arch}" "${ROOT_DIR}/payload_${arch}"
              mkdir -p "${ROOT_DIR}/extract_${arch}" "${ROOT_DIR}/payload_${arch}"

              # 1. İndir
              if ! curl -sSL -f "$url" -o "${ROOT_DIR}/dl_${arch}/${filename}"; then
                echo "::warning:: [$arch] $filename indirilemedi, sıradaki formata geçiliyor..."
                continue
              fi

              # 2. Çıkar
              cd "${ROOT_DIR}/extract_${arch}"
              local extract_ok=1

              case "$filename" in
                *.rpm)
                  rpm2cpio "${ROOT_DIR}/dl_${arch}/${filename}" | cpio -idmv || extract_ok=0
                  ;;
                *.deb)
                  ( ar x "${ROOT_DIR}/dl_${arch}/${filename}" && tar -xf data.tar.* ) || extract_ok=0
                  ;;
                *.AppImage|*.appimage)
                  chmod +x "${ROOT_DIR}/dl_${arch}/${filename}"
                  ( "${ROOT_DIR}/dl_${arch}/${filename}" --appimage-extract && mv squashfs-root/* . && rm -rf squashfs-root ) || extract_ok=0
                  ;;
                *)
                  extract_ok=0
                  ;;
              esac

              if [ $extract_ok -eq 0 ]; then
                echo "::warning:: [$arch] $filename açılamadı! Bir sonraki pakete geçiliyor..."
                cd "${ROOT_DIR}"
                continue
              fi

              # 3. Gerçek Gecko Çekirdek Dizinini Tespit Et (/usr/bin kısayollarını atla)
              local core_dir
              core_dir=$(find . -type f \( -name "application.ini" -o -name "omni.ja" -o -name "libxul.so" \) -exec dirname {} + | head -n 1 || true)

              if [ -z "$core_dir" ]; then
                echo "::warning:: [$arch] $filename içinde Gecko motor çekirdeği (omni.ja/application.ini) bulunamadı!"
                cd "${ROOT_DIR}"
                continue
              fi

              echo "Bulunan gerçek motor dizini: $core_dir"
              cp -a "$core_dir"/* "${ROOT_DIR}/payload_${arch}/"

              # 4. Dosya İzinleri ve Simgeler
              chmod -R u+w "${ROOT_DIR}/payload_${arch}"
              find "${ROOT_DIR}/payload_${arch}" -type f \( -name "mercury" -o -name "mercury-bin" -o -name "*.so*" \) -exec chmod 0755 {} +

              # Dışarıda kalan olası simgeleri de köke yedekle
              find . -type f \( -name "*logo*.png" -o -name "*mercury*.png" -o -name "default*.png" \) -exec cp -n {} "${ROOT_DIR}/payload_${arch}/" \; 2>/dev/null || true

              # 5. Emniyet Kilidi: Payload Boyut Kontrolü (Minimum 50 MB)
              local payload_size
              payload_size=$(du -sm "${ROOT_DIR}/payload_${arch}" | cut -f1)
              echo "[$arch] Toplam payload boyutu: ${payload_size} MB"

              if [ "$payload_size" -lt 50 ]; then
                echo "::warning:: [$arch] Payload boyutu yetersiz ($payload_size MB < 50 MB). Eksik paketleme engellendi!"
                cd "${ROOT_DIR}"
                continue
              fi

              # 6. Tarball Oluştur
              if ! tar -czf "${ROOT_DIR}/mercury-payload-${arch}.tar.gz" -C "${ROOT_DIR}/payload_${arch}" .; then
                echo "::warning:: [$arch] Payload tarball oluşturulamadı!"
                cd "${ROOT_DIR}"
                continue
              fi

              cd "${ROOT_DIR}"
              echo "BAŞARILI: [$arch] mimarisi tam olarak ($payload_size MB) paketlendi."
              success=1
              break
            done <<< "$candidates"

            if [ $success -eq 0 ]; then
              echo "HATA: [$arch] için hiçbir paket tam boyutla hazırlanamadı!" >&2
              exit 1
            fi
          }

          process_arch "x86_64" "AVX2"
          process_arch "aarch64" "ARM64"
