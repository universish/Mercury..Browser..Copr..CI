name: Mercury Upstream Sync & Copr Builder

on:
  schedule:
    # 16:30 UTC ve 21:30 UTC -> US East (Ashburn, VA) Öğle molası ve Mesai bitimi
    - cron: '30 16,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - name: Gerekli Paketleri Yükle
        run: |
          dnf install -y git curl jq cpio rpm-build rpmdevtools copr-cli \
                         binutils p7zip tar zstd gzip unzip python3 \
                         desktop-file-utils libappstream-glib file

      - name: Git Güvenli Dizin Yapılandırması
        run: |
          git config --global --add safe.directory '*'

      - name: Depoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upstream Sürümlerini ve İndirilebilir Varlıkları Denetle
        id: fetch-assets
        run: |
          REPO="Alex313031/Mercury"
          RELEASE_JSON=$(curl -s "https://api.github.com/repos/${REPO}/releases/latest")
          LATEST_TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name // empty')

          if [ -z "$LATEST_TAG" ] \vert{}\vert{} [ "$LATEST_TAG" = "null" ]; then
            echo "Upstream sürüm bulunamadı."
            exit 0
          fi

          CLEAN_VER=$(echo "$LATEST_TAG" | sed 's/[^0-9.]*//g')
          echo "clean_version=$CLEAN_VER" >> $GITHUB_OUTPUT

          # Öncelik Sırası: rpm -> portable (zip/tar) -> deb -> appimage
          find_asset_url() {
            local arch_pat="$1"
            local matched_url=""

            # 1. RPM
            matched_url=$(echo "$RELEASE_JSON" | jq -r --arg pat "$arch_pat" \
              '.assets[] | select(.name | test($pat; "i")) \vert{} select(.name \vert{} test("\\.rpm$"; "i")) | .browser_download_url' | head -n 1)
            [ -n "$matched_url" ] && [ "$matched_url" != "null" ] && echo "$matched_url" && return

            # 2. Portable (ZIP / TAR)
            matched_url=$(echo "$RELEASE_JSON" | jq -r --arg pat "$arch_pat" \
              '.assets[] | select(.name | test($pat; "i")) | select(.name | test("\\.zip$\vert{}\\.tar\\.xz$|\\.tar\\.gz$\vert{}\\.tar$"; "i")) | .browser_download_url' | head -n 1)
            [ -n "$matched_url" ] && [ "$matched_url" != "null" ] && echo "$matched_url" && return

            # 3. DEB
            matched_url=$(echo "$RELEASE_JSON" | jq -r --arg pat "$arch_pat" \
              '.assets[] | select(.name | test($pat; "i")) \vert{} select(.name \vert{} test("\\.deb$"; "i")) | .browser_download_url' | head -n 1)
            [ -n "$matched_url" ] && [ "$matched_url" != "null" ] && echo "$matched_url" && return

            # 4. AppImage
            matched_url=$(echo "$RELEASE_JSON" | jq -r --arg pat "$arch_pat" \
              '.assets[] | select(.name | test($pat; "i")) \vert{} select(.name \vert{} test("\\.appimage$"; "i")) | .browser_download_url' | head -n 1)
            [ -n "$matched_url" ] && [ "$matched_url" != "null" ] && echo "$matched_url" && return

            echo ""
          }

          URL_X86=$(find_asset_url "AVX2")
          URL_ARM=$(find_asset_url "ARM64")

          if [ -z "$URL_X86" ] \vert{}\vert{} [ -z "$URL_ARM" ]; then
            echo "Gerekli AVX2 veya ARM64 varlıkları bulunamadı."
            exit 1
          fi

          echo "url_x86=$URL_X86" >> $GITHUB_OUTPUT
          echo "url_arm=$URL_ARM" >> $GITHUB_OUTPUT

      - name: İndir, Ayıkla ve Standart Payload Paketle
        run: |
          set -euo pipefail

          process_arch() {
            local arch="$1"
            local url="$2"
            local filename
            filename=$(basename "$url")

            echo "İşleniyor: $arch ($filename)"
            mkdir -p "dl_${arch}" "extract_${arch}" "payload_${arch}"
            curl -sL "$url" -o "dl_${arch}/${filename}"

            cd "extract_${arch}"
            case "$filename" in
              *.rpm)
                rpm2cpio "../dl_${arch}/${filename}" | cpio -idmv
                ;;
              *.zip)
                unzip -q "../dl_${arch}/${filename}"
                ;;
              *.tar.gz|*.tgz)
                tar -xzf "../dl_${arch}/${filename}"
                ;;
              *.tar.xz)
                tar -xJf "../dl_${arch}/${filename}"
                ;;
              *.tar.zst)
                tar --zstd -xf "../dl_${arch}/${filename}"
                ;;
              *.tar)
                tar -xf "../dl_${arch}/${filename}"
                ;;
              *.deb)
                ar x "../dl_${arch}/${filename}"
                tar -xf data.tar.*
                ;;
              *.AppImage|*.appimage)
                chmod +x "../dl_${arch}/${filename}"
                "../dl_${arch}/${filename}" --appimage-extract
                mv squashfs-root/* .
                rm -rf squashfs-root
                ;;
              *)
                7z x "../dl_${arch}/${filename}"
                ;;
            esac

            # İkili dosyanın (mercury) bulunduğu dizini tespit et ve payload dizinine kopyala
            BIN_DIR=$(find . -maxdepth 3 -type f \( -name "mercury" -o -name "mercury-browser" \) -exec dirname {} + | head -n 1)
            
            if [ -n "$BIN_DIR" ]; then
              cp -a "$BIN_DIR"/* "../payload_${arch}/"
            else
              cp -a ./* "../payload_${arch}/"
            fi

            cd "../payload_${arch}"
            # Temiz bir şekilde tar.gz arşivi üret
            tar -czf "../../mercury-payload-${arch}.tar.gz" *
            cd ../..
          }

          process_arch "x86_64" "${{ steps.fetch-assets.outputs.url_x86 }}"
          process_arch "aarch64" "${{ steps.fetch-assets.outputs.url_arm }}"

      - name: Desktop Dosyasını Akıllı Denetle ve Güncelle
        run: |
          python3 - << 'EOF'
          import os
          import glob

          target_exec = "env NVD_BACKEND=direct __NV_PRIME_RENDER_OFFLOAD=1 __GLX_VENDOR_LIBRARY_NAME=nvidia /usr/bin/mercury-browser --ozone-platform=x11 --enable-features=VaapiVideoDecodeLinuxGL,VaapiVideoEncoderLinuxGL --ignore-gpu-blocklist --enable-zero-copy --use-gl=angle --use-angle=gl"
          desktop_matches = glob.glob('extract_x86_64/**/*.desktop', recursive=True)
          output_desktop = 'mercury-browser.desktop'

          if desktop_matches:
              src_desktop = desktop_matches[0]
              with open(src_desktop, 'r', encoding='utf-8', errors='ignore') as f:
                  lines = f.readlines()

              updated_lines = []
              for line in lines:
                  if line.strip().startswith('Exec='):
                      parts = line.strip().split('Exec=', 1)[1].strip()
                      extra_flags = ""
                      for flag in ['%U', '%u', '--incognito', '--temp-profile', '--safe-mode']:
                          if flag in parts and flag not in extra_flags:
                              extra_flags += f" {flag}"
                      updated_lines.append(f"Exec={target_exec}{extra_flags}\n")
                  elif line.strip().startswith('Icon='):
                      updated_lines.append("Icon=mercury-browser\n")
                  else:
                      updated_lines.append(line)

              with open(output_desktop, 'w', encoding='utf-8') as f:
                  f.writelines(updated_lines)
          else:
              full_content = f
